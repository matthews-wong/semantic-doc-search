[project]
name = "semantic-doc-search"
version = "0.1.0"
description = "Embeddings-based semantic search over a documentation corpus."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Put the repo root on sys.path so tests can `import app` under a bare
# `pytest` invocation (CI installs requirements only, no editable install).
pythonpath = ["."]
